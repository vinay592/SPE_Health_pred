<!DOCTYPE html>
<html>
<head>
<title>Health AI Predictor</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #1d2b64, #f8cdda);
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    display: flex;
    gap: 30px;
}

/* LEFT INPUT CARD */
.card {
    background: white;
    padding: 25px;
    width: 350px;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
}

h2 {
    text-align: center;
}

input, select {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #00c6ff, #0072ff);
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    transform: scale(1.05);
}

/* RIGHT RESULT CARD */
.result-card {
    background: white;
    padding: 25px;
    width: 350px;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
}

.section {
    margin-top: 15px;
}

.section h3 {
    margin-bottom: 5px;
}

.high {
    color: red;
    font-weight: bold;
}

.low {
    color: green;
    font-weight: bold;
}

ul {
    padding-left: 20px;
}

.note {
    font-size: 12px;
    color: gray;
    margin-top: 10px;
    text-align: center;
}
</style>
</head>

<body>

<div class="container">

<!-- INPUT -->
<div class="card">
    <h2>🧠 Health AI</h2>

    <input id="age" placeholder="Age (20-80)">
    <input id="bp" placeholder="Blood Pressure (90-180)">
    <input id="chol" placeholder="Cholesterol (150-350)">
    <input id="thalach" placeholder="Heart Rate (70-200)">
    <input id="oldpeak" placeholder="Oldpeak (0-6)">

    <select id="cp">
        <option value="0">Typical Angina</option>
        <option value="1">Atypical Angina</option>
        <option value="2">Non-anginal Pain</option>
        <option value="3">Asymptomatic</option>
    </select>

    <select id="exang">
        <option value="0">No Exercise Angina</option>
        <option value="1">Exercise Angina</option>
    </select>

    <button onclick="predict()">Predict</button>

    <div class="note">AI-based prediction — not medical advice</div>
</div>

<!-- RESULT -->
<div class="result-card" id="resultCard">
    <h2>Result</h2>
    <div id="result">Enter values and click predict</div>
</div>

</div>

<script>
function predict() {
    const data = {
        age: Number(age.value),
        bp: Number(bp.value),
        chol: Number(chol.value),
        thalach: Number(thalach.value),
        oldpeak: Number(oldpeak.value),
        cp: Number(cp.value),
        exang: Number(exang.value)
    };

    fetch("/predict", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(res => {
        if(res.error){
            result.innerHTML = `<p style="color:red">${res.error}</p>`;
            return;
        }

        let color = res.risk === "High" ? "high" : "low";

        let html = `
            <div class="section">
                <h3>Risk</h3>
                <p class="${color}">${res.risk}</p>
            </div>

            <div class="section">
                <h3>Reasons</h3>
                <ul>${res.reasons.map(r => `<li>${r}</li>`).join("")}</ul>
            </div>

            <div class="section">
                <h3>Recommendations</h3>
                <ul>${res.recommendations.map(r => `<li>${r}</li>`).join("")}</ul>
            </div>
        `;

        result.innerHTML = html;
    })
    .catch(() => {
        result.innerHTML = `<p style="color:red">Server error</p>`;
    });
}
</script>

</body>
</html>
